<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Audiobook Translation Review{% endblock %}</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e3e5e9;
    --text: #1c1f26;
    --text-muted: #6b7280;
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --primary-soft: #eef2ff;
    --ok-bg: #dcfce7; --ok-text: #15803d;
    --warn-bg: #fef3c7; --warn-text: #92400e;
    --fail-bg: #fee2e2; --fail-text: #b91c1c;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.06);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1080px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { margin: 0 0 0.3rem; font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; }
  h2 { font-size: 1.2rem; font-weight: 600; }
  .meta { color: var(--text-muted); margin: 0 0 1.5rem; font-size: 0.95rem; }
  .back-link { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--text-muted);
    font-size: 0.88rem; margin-bottom: 1rem; font-weight: 500; }
  .back-link:hover { color: var(--primary); text-decoration: none; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.4rem; box-shadow: var(--shadow); text-decoration: none; color: inherit;
    display: block; transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(16,24,40,0.1); border-color: #d1d5f0; text-decoration: none; }
  .card.disabled { opacity: 0.55; cursor: not-allowed; }
  .card.disabled:hover { transform: none; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 0.6rem; font-size: 1.05rem; font-weight: 600; }
  .card .badge-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  .badge {
    display: inline-flex; align-items: center; font-size: 0.72rem; font-weight: 600;
    padding: 0.25rem 0.6rem; border-radius: 999px; letter-spacing: 0.01em; text-transform: uppercase;
  }
  .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
  .badge-fail { background: var(--fail-bg); color: var(--fail-text); }

  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem; background: var(--primary); color: #fff;
    padding: 0.55rem 1.1rem; border-radius: 8px; text-decoration: none; border: none; cursor: pointer;
    font-size: 0.9rem; font-weight: 600; transition: background 0.12s ease, box-shadow 0.12s ease;
    box-shadow: 0 1px 2px rgba(79,70,229,0.25);
  }
  .btn:hover { background: var(--primary-dark); text-decoration: none; }
  .btn:active { transform: translateY(1px); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  .btn-secondary:hover { background: #f9fafb; border-color: #c7cad1; }
  .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.78rem; }
  .btn-danger { background: #dc2626; box-shadow: 0 1px 2px rgba(220,38,38,0.25); }
  .btn-danger:hover { background: #b91c1c; }
  .actions-row { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.5rem; }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 0.75rem 1rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  th { background: #fafafa; color: var(--text-muted); font-size: 0.75rem; font-weight: 600;
       text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbff; }

  .empty-state { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 2.5rem; text-align: center; color: var(--text-muted); }

  form.stack p { margin: 0 0 1.1rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text); }
  input[type=text], input[type=file] {
    width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.95rem; font-family: inherit; background: #fff;
  }
  input[type=text]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .field-hint { color: var(--text-muted); font-size: 0.82rem; margin-top: 0.3rem; }
  .alert { padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem; }
  .alert-error { background: var(--fail-bg); color: var(--fail-text); border: 1px solid #fca5a5; }
  .alert-info { background: var(--primary-soft); color: var(--primary-dark); border: 1px solid #c7d2fe; }

  .btn-spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; animation: btn-spin 0.7s linear infinite; display: inline-block; }
  .btn-secondary .btn-spinner { border-color: var(--border); border-top-color: var(--text-muted); }
  @keyframes btn-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="page">
{% block body %}{% endblock %}
</div>
<script>
  document.addEventListener("submit", function (e) {
    const form = e.target;
    if (!form.matches("[data-confirm]") && !form.matches("[data-pending-text]")) return;

    const confirmMsg = form.dataset.confirm;
    if (confirmMsg && !confirm(confirmMsg)) {
      e.preventDefault();
      return;
    }

    const btn = form.querySelector("button[type=submit]");
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.dataset.originalText = btn.innerHTML;
    btn.innerHTML = `<span class="btn-spinner"></span> ${form.dataset.pendingText || "Working…"}`;
  });
</script>
</body>
</html>
