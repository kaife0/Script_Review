{% extends "base.html" %}
{% block title %}{{ episode.title }} — Processing{% endblock %}
{% block body %}
<p class="meta"><a href="{{ url_for('lang_dashboard', lang_code=episode.target_lang) }}">&larr; {{ episode.target_lang_name }} episodes</a></p>
<h1>{{ episode.title }}</h1>

<div id="status-box">
  <p class="meta">Status: <strong id="status-text">{{ episode.status }}</strong></p>
  {% if episode.status == "failed" %}
    <p style="color:#c00">{{ episode.error_message }}</p>
    <form method="post" action="{{ url_for('episode_retry', episode_id=episode._id) }}">
      <button class="btn" type="submit">Retry</button>
    </form>
  {% endif %}
</div>

<script>
  const episodeId = {{ episode._id | tojson }};
  function poll() {
    fetch(`/episode/${episodeId}/status`).then(r => r.json()).then(data => {
      document.getElementById("status-text").textContent =
        data.status + (data.total_rows ? ` (audio ${data.audio_done}/${data.total_rows})` : "");
      if (data.status === "done") {
        window.location.reload();
      } else if (data.status !== "failed") {
        setTimeout(poll, 2000);
      }
    });
  }
  {% if episode.status not in ("done", "failed") %}
  setTimeout(poll, 2000);
  {% endif %}
</script>
{% endblock %}
