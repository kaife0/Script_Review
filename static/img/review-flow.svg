<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="-apple-system, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b7280" />
    </marker>
  </defs>

  <!-- ===== Row 1 (y ~20-72): open a line ===== -->
  <rect x="260" y="20" width="200" height="52" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="360" y="42" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1f26">Open a line</text>
  <text x="360" y="58" text-anchor="middle" font-size="10.5" fill="#6b7280">episode &rarr; chapter &rarr; dialogue</text>

  <!-- ===== Row 2 (y ~130-182): text pass ===== -->
  <rect x="60" y="130" width="150" height="52" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="135" y="161" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1f26">Review text</text>

  <rect x="260" y="130" width="150" height="52" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="335" y="161" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1f26">Mark complete</text>

  <polygon points="500,116 560,156 500,196 440,156" fill="#fff7ed" stroke="#fdba74"/>
  <text x="500" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1c1f26">Text</text>
  <text x="500" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#1c1f26">changed?</text>

  <rect x="590" y="130" width="100" height="52" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="640" y="152" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1f26">Regenerate</text>
  <text x="640" y="167" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1f26">audio</text>

  <!-- ===== Row 3 (y ~240-292): audio pass ===== -->
  <rect x="260" y="240" width="150" height="52" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="335" y="271" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c1f26">Listen to audio</text>

  <polygon points="500,226 560,266 500,306 440,266" fill="#fff7ed" stroke="#fdba74"/>
  <text x="500" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="#1c1f26">Sounds</text>
  <text x="500" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#1c1f26">wrong?</text>

  <rect x="590" y="240" width="100" height="52" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="640" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1f26">Record /</text>
  <text x="640" y="277" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1c1f26">upload</text>

  <!-- ===== Row 4 (y ~330): verified ===== -->
  <rect x="60" y="330" width="200" height="40" rx="9" fill="#dcfce7" stroke="#86efac"/>
  <text x="160" y="354" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">&#10003; Mark verified</text>

  <!-- ===== arrows ===== -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <!-- open line -> review text -->
    <path d="M300,72 V100 H135 V128"/>
    <!-- review text -> mark complete -->
    <path d="M210,156 H258"/>
    <!-- mark complete -> decision1 -->
    <path d="M410,156 H438"/>
    <!-- decision1 yes(right) -> regenerate audio -->
    <path d="M560,156 H588"/>
    <!-- decision1 no(down) -> listen -->
    <path d="M500,196 V240"/>
    <!-- regenerate audio -> listen -->
    <path d="M640,182 V266 H562"/>
    <!-- listen -> decision2 -->
    <path d="M410,266 H438"/>
    <!-- decision2 yes(right) -> record/upload -->
    <path d="M560,266 H588"/>
    <!-- decision2 no(down) -> mark verified -->
    <path d="M500,306 V350 H262"/>
    <!-- record/upload -> mark verified -->
    <path d="M640,292 V350 H262"/>
  </g>

  <!-- loop-back: mark verified -> open line, routed fully outside on the left -->
  <path d="M60,350 H25 V40 H258" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <g font-size="10.5" font-weight="700" fill="#6b7280">
    <text x="565" y="150">yes</text>
    <text x="510" y="216">no</text>
    <text x="565" y="260">yes</text>
    <text x="510" y="326">no</text>
  </g>

  <text x="25" y="200" font-size="10" fill="#9ca3af" transform="rotate(-90 25 200)">back to the next line</text>
</svg>
